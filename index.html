<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#f5f7fb">
    <meta name="description" content="国内外の最新AIニュースをカテゴリ別にまとめてチェック。">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="AI NEWS">
    <title>AI NEWS — AIニュースを、ひと目で。</title>
    <link rel="manifest" href="manifest.webmanifest">
    <link rel="apple-touch-icon" href="icon.svg">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Noto+Sans+JP:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>
    <div class="app-shell">
      <aside class="sidebar">
        <a class="brand" href="./" aria-label="AI NEWS ホーム">
          <span class="brand-mark" aria-hidden="true">✳</span>
          <span>AI<span class="brand-light">NEWS</span></span>
        </a>
        <div class="sidebar-label">FEED</div>
        <nav class="category-nav" aria-label="ニュースカテゴリ">
          <button class="nav-item is-active" type="button" data-category="all">
            <span class="nav-icon">◈</span><span>すべてのニュース</span>
          </button>
          <button class="nav-item" type="button" data-category="generative">
            <span class="nav-icon">✳</span><span>生成AI</span>
          </button>
          <button class="nav-item" type="button" data-category="business">
            <span class="nav-icon">▧</span><span>ビジネス</span>
          </button>
          <button class="nav-item" type="button" data-category="research">
            <span class="nav-icon">⌘</span><span>研究・テクノロジー</span>
          </button>
          <button class="nav-item" type="button" data-category="japan">
            <span class="nav-icon">◎</span><span>日本のAI</span>
          </button>
        </nav>
        <div class="sidebar-bottom">
          <div class="source-note"><span class="source-dot"></span>Google ニュース RSS</div>
          <p>ニュースの見出しとリンクを<br>リアルタイムでお届けします。</p>
        </div>
      </aside>

      <main class="main-content">
        <header class="topbar">
          <div class="breadcrumb"><span>HOME</span><span class="breadcrumb-slash">/</span><strong id="breadcrumb-category">すべてのニュース</strong></div>
          <div class="topbar-right">
            <span class="live-indicator"><span class="live-dot"></span>LIVE FEED</span>
            <span class="today-date" id="today-date"></span>
          </div>
        </header>

        <section class="page-heading">
          <div class="heading-copy">
            <div class="eyebrow"><span class="eyebrow-line"></span>THE LATEST IN ARTIFICIAL INTELLIGENCE</div>
            <h1>AIニュースを、<span>ひと目で。</span></h1>
            <p class="page-description">世界中のAIの動きを、ここからキャッチアップ。</p>
          </div>
          <div class="heading-art" aria-hidden="true">
            <div class="orbit orbit-one"></div>
            <div class="orbit orbit-two"></div>
            <div class="orbit-core">AI</div>
            <span class="orbit-spark spark-one">✳</span>
            <span class="orbit-spark spark-two">✦</span>
          </div>
        </section>

        <section class="toolbar" aria-label="ニュース操作">
          <form class="search-form" id="search-form">
            <span class="search-icon" aria-hidden="true"></span>
            <input id="search-input" type="search" placeholder="気になるキーワードで検索..." aria-label="ニュースを検索">
            <button type="submit">検索</button>
          </form>
          <button class="refresh-button" id="refresh-button" type="button">
            <span class="refresh-icon" aria-hidden="true">↻</span><span>更新</span>
          </button>
        </section>

        <section class="feed-section" aria-labelledby="feed-heading">
          <div class="feed-heading">
            <div>
              <h2 id="feed-heading">今日のピックアップ</h2>
              <p id="feed-subtitle">最新のAI関連ニュース</p>
            </div>
            <div class="feed-meta"><span class="article-count" id="article-count">— 件</span><span class="meta-divider"></span><span id="last-updated">取得中...</span></div>
          </div>
          <div class="status-message" id="status-message" role="status" aria-live="polite">ニュースを読み込んでいます...</div>
          <div class="news-grid" id="news-grid"></div>
        </section>
        <footer class="page-footer">ニュース提供元：Google ニュース　·　記事の内容および権利は各配信元に帰属します。</footer>
      </main>
    </div>
    <script src="app-config.js"></script>
    <script src="app.js" defer></script>
  </body>
</html>
